name: Release VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run typecheck
          npm test -- --runInBand

      - name: Verify tag version
        if: ${{ github.actor != 'nektos/act' }}
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          expected_tag="v${package_version}"
          if [ "$TAG_NAME" != "$expected_tag" ]; then
            echo "Tag $TAG_NAME does not match package version $package_version"
            exit 1
          fi

      - name: Package VSIX
        run: npm run package

      - name: Create GitHub Release
        if: ${{ github.actor != 'nektos/act' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" ./*.vsix --title "$TAG_NAME" --generate-notes

  publish-openvsx:
    needs: release
    if: ${{ vars.ENABLE_OPENVSX_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release download "$TAG_NAME" --pattern '*.vsix'

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx publish ./*.vsix --pat "$OVSX_PAT"
